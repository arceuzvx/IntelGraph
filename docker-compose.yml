services:
  vectorai:
    image: actian/vectorai:latest
    container_name: vectorai

    ports:
      - "6573:6573"
      - "6574:6574"
      - "6575:6575"

    environment:
      ACTIAN_VECTORAI_ACCEPT_EULA: "YES"

    volumes:
      - vectorai_data:/var/lib/actian-vectorai

    restart: unless-stopped

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      VECTORAI_HOST: vectorai:6574
      HF_HOME: /cache/huggingface
    volumes:
      - huggingface_cache:/cache/huggingface
      - intelgraph_data:/app/data
    depends_on:
      - vectorai
    restart: unless-stopped

volumes:
  vectorai_data:
  huggingface_cache:
  intelgraph_data:
